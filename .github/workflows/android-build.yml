name: Android build

on:
  push:
    paths:
      - "VCamera-Plus/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "VCamera-Plus/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p VCamera-Plus assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamera-Plus-debug
          path: VCamera-Plus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
