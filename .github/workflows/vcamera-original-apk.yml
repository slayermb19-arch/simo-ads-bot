name: Build original VCamera APK

on:
  push:
    paths:
      - ".github/workflows/vcamera-original-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-original-vcamera:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out build config
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-33" "build-tools;31.0.0" "platform-tools"

      - name: Switch to Java 11 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle 7.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.0.2"

      - name: Clone upstream VCamera
        run: git clone --depth 1 https://github.com/andvipgroup/VCamera.git VCamera

      - name: Fetch the required opensdk module
        run: git clone --depth 1 https://github.com/WaxMoon/opensdk.git VCamera/opensdk

      - name: Enable AndroidX compatibility for the legacy project
        run: |
          touch VCamera/gradle.properties
          grep -q '^android.useAndroidX=' VCamera/gradle.properties || echo 'android.useAndroidX=true' >> VCamera/gradle.properties
          grep -q '^android.enableJetifier=' VCamera/gradle.properties || echo 'android.enableJetifier=true' >> VCamera/gradle.properties

      - name: Build debug APK
        run: gradle -p VCamera assembleDebug --stacktrace

      - name: Upload original VCamera APK
        uses: actions/upload-artifact@v4
        with:
          name: VCamera-original-debug-APK
          path: VCamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
